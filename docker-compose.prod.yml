version: "3.9"

services:
  app:
    build: .
    container_name: legal-qa-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: legal-qa-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
